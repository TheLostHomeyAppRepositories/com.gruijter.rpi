
<script>
	Homey.showLoadingOverlay();
	// This view is the initial repair view, so it runs immediately.
	Homey.emit('get_device_data')
		.then(deviceData => {
			if (deviceData) {
				document.getElementById('host').value = deviceData.host || '';
				document.getElementById('port').value = deviceData.port || 22;
				document.getElementById('username').value = deviceData.username || 'pi';
			}
			Homey.hideLoadingOverlay();
		})
		.catch(error => {
			Homey.hideLoadingOverlay();
			Homey.alert(error.message || Homey.__('repair.data_error'), 'error');
		});

	async function manual() {
		try {
			Homey.showLoadingOverlay();
			const connectionSettings = {
				host: document.getElementById('host').value,
				port: Number(document.getElementById('port').value) || 22,
				username: document.getElementById('username').value,
				password: document.getElementById('password').value,
			};
			if (!connectionSettings.host || !connectionSettings.username) {
				throw new Error(Homey.__('pair.incomplete'));
			}
			const result = await Homey.emit('manual_login', connectionSettings);
			Homey.hideLoadingOverlay();
			if (result && result.warning) {
				await Homey.alert(result.warning, 'info');
			}
			Homey.done();
		} catch (error) { 
			Homey.hideLoadingOverlay();
			Homey.alert(error.message || error.toString(), 'error');
		}
	}
</script>

<form class="homey-form">
	<div class="homey-form-group">
		<h1 class="homey-title" data-i18n="repair.title"></h1>
		<p class="homey-subtitle" data-i18n="repair.text"></p>

		<label class="homey-form-label" for="host" data-i18n="pair.host"></label>
		<input class="homey-form-input" id="host" type="text" placeholder="e.g. 10.0.0.100" value="" />

		<label class="homey-form-label" for="port" data-i18n="pair.port"></label>
		<input class="homey-form-input" id="port" type="number" value=22 />

		<label class="homey-form-label" for="username" data-i18n="pair.username"></label>
		<input class="homey-form-input" id="username" type="text" value="pi" />

		<label class="homey-form-label" for="password" data-i18n="pair.password"></label>
		<input class="homey-form-input" id="password" type="password" placeholder="e.g. raspberry" value="" />

	</div>
</form>
<br>
<button class="homey-button-primary-full" id="manual" onclick="manual()" data-i18n="pair.continue" ></button>
